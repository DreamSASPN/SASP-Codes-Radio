<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SASP SUD | Codes Radio</title>
<style>
:root{--bg:#08111d;--panel:#101d2c;--panel2:#142438;--line:#263b52;--text:#eef5ff;--muted:#9eb0c5;--blue:#2585ff;--blue2:#1457b8;--red:#e54b56;--green:#2cc995;--gold:#f4c76b}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#132840 0%,var(--bg) 55%);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif;line-height:1.5}
header{padding:32px 20px 26px;border-bottom:1px solid var(--line);background:linear-gradient(110deg,rgba(17,39,63,.95),rgba(7,16,28,.96));}
.wrap{max-width:1200px;margin:auto}.topline{display:flex;align-items:center;gap:14px}.sasp-logo{width:76px;height:76px;object-fit:contain;flex:0 0 auto}.badge{width:54px;height:54px;border:2px solid #7eb9ff;border-radius:50%;display:grid;place-items:center;font-weight:900;letter-spacing:-1px;color:#fff;background:linear-gradient(145deg,#1d66bd,#07172a);box-shadow:0 0 22px #1674d744}
.eyebrow{font-size:.75rem;text-transform:uppercase;letter-spacing:.22em;color:#83baff;font-weight:800}h1{margin:2px 0;font-size:clamp(1.7rem,4vw,2.7rem);letter-spacing:.04em}header p{margin:12px 0 0;color:var(--muted);max-width:720px}
nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}nav a{color:#dcecff;text-decoration:none;padding:8px 12px;border:1px solid var(--line);border-radius:8px;font-size:.88rem;background:#ffffff05}nav a:hover{border-color:var(--blue);background:#2585ff18}
main{padding:26px 20px 60px}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:18px}.card{background:linear-gradient(145deg,rgba(19,35,53,.98),rgba(12,25,40,.98));border:1px solid var(--line);border-radius:15px;padding:20px;box-shadow:0 10px 30px #0002;min-width:0}.span-4{grid-column:span 4}.span-5{grid-column:span 5}.span-7{grid-column:span 7}.span-8{grid-column:span 8}.span-12{grid-column:span 12}
h2{font-size:1.12rem;margin:0 0 14px;display:flex;align-items:center;gap:9px}h2:before{content:"";display:block;width:4px;height:22px;background:var(--blue);border-radius:4px}.sub{color:var(--muted);font-size:.88rem;margin:-7px 0 14px}
.pills{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.pill{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#ffffff04}.pill strong{color:#8fc2ff;display:block;font-size:.88rem}.pill span{font-size:.85rem;color:#dce7f5}
.list{display:grid;gap:7px}.item{display:flex;align-items:flex-start;gap:12px;padding:9px 10px;border-radius:8px;background:#ffffff04;border:1px solid #ffffff08}.code{flex:0 0 auto;min-width:66px;color:#8fc2ff;font-weight:800;font-variant-numeric:tabular-nums}.desc{flex:1}.tag{font-size:.68rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:2px 7px;white-space:nowrap}
input,select,button{font:inherit}input,select{width:100%;padding:11px 12px;color:var(--text);background:#081522;border:1px solid var(--line);border-radius:9px;outline:none}input:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px #2585ff20}
label{display:block;color:#c5d4e6;font-size:.82rem;font-weight:700;margin:12px 0 6px}.formrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.btn{border:1px solid var(--blue);background:var(--blue);color:white;font-weight:800;padding:10px 15px;border-radius:9px;cursor:pointer}.btn.secondary{background:transparent;border-color:var(--line);color:#d7e5f7}.btn:hover{filter:brightness(1.12)}.result{margin-top:14px;padding:12px;border-radius:9px;border:1px solid #2585ff55;background:#2585ff12;display:none}.searchbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.searchbar input{flex:1;min-width:200px}.searchbar button{white-space:nowrap}.alphabet{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px}.letter{background:#ffffff05;border:1px solid var(--line);border-radius:8px;text-align:center;padding:8px 4px}.letter b{display:block;color:#8fc2ff}.letter span{font-size:.74rem;color:#c4d3e5}.empty{color:var(--muted);padding:12px;text-align:center;display:none}
footer{border-top:1px solid var(--line);padding:22px 20px;color:var(--muted);font-size:.82rem;text-align:center}
@media(max-width:850px){.span-4,.span-5,.span-7,.span-8{grid-column:span 12}.pills{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:480px){.sasp-logo{width:60px;height:60px}header{padding-top:24px}.card{padding:15px}.pills{grid-template-columns:1fr}.formrow{grid-template-columns:1fr}.alphabet{grid-template-columns:repeat(4,minmax(0,1fr))}.tag{display:none}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="topline">
      <div class="badge">SASP</div>
      <div>
        <div class="eyebrow">SASP SUD</div>
        <h1>Codes Radio &amp; Procédures</h1>
      </div>
    </div>
    <p>Guide officiel des codes radio, procédures d'urgence et alphabets de communication du SASP SUD.</p>
  </div>
</header>
<footer>
  <div class="wrap">
    <p>&copy; SASP SUD - Document officiel de service</p>
  </div>
</footer>
</body>
</html>
